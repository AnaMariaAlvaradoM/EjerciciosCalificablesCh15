name: Calificar ejercicios

# pull_request_target: corre SIEMPRE, sin esperar aprobación de la profe.
# El workflow se toma de main, así que el estudiante no lo puede modificar.
on:
  pull_request_target:
    branches: [main]

permissions: {}

concurrency:
  group: calificar-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # Corre el código del estudiante con permisos de SOLO LECTURA
  calificar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Descargar tests y scripts oficiales (desde main)
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Descargar la entrega del estudiante
        uses: actions/checkout@v7
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: entrega
          persist-credentials: false
          allow-unsafe-pr-checkout: true

      - name: Usar solo la carpeta ejercicios del estudiante
        run: |
          rm -rf ejercicios
          mkdir ejercicios
          if [ -d entrega/ejercicios ]; then cp -r entrega/ejercicios/. ejercicios/; fi
          rm -rf entrega

      - name: Instalar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Correr tests y calcular nota
        run: node scripts/calificar.js

      - name: Guardar resultado para publicar la nota
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: resultado
          path: resultado.json
          if-no-files-found: ignore
          retention-days: 7

  # Publica la nota. NO ejecuta código del estudiante.
  publicar:
    needs: calificar
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      pull-requests: write
    env:
      # Fecha límite opcional. Ejemplo: "2026-10-10T23:59:00-05:00". Vacía = sin límite.
      FECHA_LIMITE: ""
    steps:
      - name: Leer la lista oficial de tests (desde main)
        uses: actions/checkout@v7
        with:
          sparse-checkout: tests
          persist-credentials: false

      - name: Descargar el resultado de la calificación
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: resultado
          path: resultado

      - name: Poner nota, etiqueta y comentario en el Pull Request
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require("fs");
            const { owner, repo } = context.repo;
            const MARCADOR = "<!-- nota-automatica-cafe-origen -->";
            const REVISAR = "⚠️ Revisar";
            const FUERA_DE_PLAZO = "⏰ Fuera de plazo";
            const enlaceRun = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const crearEtiqueta = async (name, color) => {
              try {
                await github.rest.issues.createLabel({ owner, repo, name, color });
              } catch (e) {
                if (e.status !== 422) throw e;
              }
            };

            // 1. El PR viene del evento (dato confiable). Si ya llegó un push más nuevo, no se publica.
            const evento = context.payload.pull_request;
            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: evento.number });
            if (pr.state !== "open" || pr.head.sha !== evento.head.sha) {
              core.info("El PR está cerrado o ya llegó un push más nuevo.");
              return;
            }

            // 2. Fecha límite (opcional): después de esa hora los push ya no cambian la nota
            const limite = process.env.FECHA_LIMITE;
            if (limite && new Date() > new Date(limite)) {
              const yaTieneNota = pr.labels.some((l) => l.name.startsWith("Nota "));
              if (!yaTieneNota) {
                await crearEtiqueta(FUERA_DE_PLAZO, "6e7781");
                await github.rest.issues.addLabels({ owner, repo, issue_number: pr.number, labels: [FUERA_DE_PLAZO] });
              }
              core.info(`PR #${pr.number}: push después de la fecha límite (${limite}); la nota no cambia.`);
              return;
            }

            // 3. Ejercicios y cantidad de tests: se leen de main, no del artefacto
            const ejercicios = fs.readdirSync("tests")
              .filter((a) => /^\d{2}-.*\.test\.js$/.test(a))
              .sort()
              .map((a) => {
                const codigo = fs.readFileSync(`tests/${a}`, "utf8");
                const slug = a.replace(/^\d+-/, "").replace(/\.test\.js$/, "").replace(/-/g, " ");
                return {
                  id: a.slice(0, 2),
                  titulo: slug.charAt(0).toUpperCase() + slug.slice(1),
                  total: (codigo.match(/^test\(/gm) || []).length,
                };
              });

            // 4. Resultado del estudiante: solo se aceptan números
            let reportados = [];
            try {
              const datos = JSON.parse(fs.readFileSync("resultado/resultado.json", "utf8"));
              if (Array.isArray(datos.ejercicios)) reportados = datos.ejercicios;
            } catch (e) {
              core.warning("No se encontró resultado.json");
            }
            const sinResultado = reportados.length === 0;

            let pasados = 0, total = 0;
            const filas = ejercicios.map((ej) => {
              const r = reportados.find((x) => x && x.id === ej.id);
              const p = r && Number.isInteger(r.pasados) ? Math.max(0, Math.min(r.pasados, ej.total)) : 0;
              pasados += p;
              total += ej.total;
              const estado = p === ej.total ? "✅" : p > 0 ? "🟡" : "❌";
              return `| ${estado} | ${ej.id} · ${ej.titulo} | ${p}/${ej.total} |`;
            });
            const nota = total ? Math.round((pasados / total) * 50) / 10 : 0;

            // 5. ¿El estudiante tocó archivos que no debía?
            const archivos = await github.paginate(github.rest.pulls.listFiles, {
              owner, repo, pull_number: pr.number, per_page: 100,
            });
            const protegidos = archivos
              .map((f) => f.filename)
              .filter((f) => /^(tests|scripts|\.github)\//.test(f) || f === "package.json");

            // 6. Etiquetas: "Nota X.X" (y "⚠️ Revisar" si aplica)
            const etiqueta = `Nota ${nota.toFixed(1)}`;
            const color = nota >= 4 ? "2da44e" : nota >= 3 ? "d4a72c" : "cf222e";
            await crearEtiqueta(etiqueta, color);
            if (protegidos.length) await crearEtiqueta(REVISAR, "bf8700");

            for (const { name } of pr.labels) {
              const vieja = (name.startsWith("Nota ") && name !== etiqueta) || (name === REVISAR && !protegidos.length);
              if (vieja) await github.rest.issues.removeLabel({ owner, repo, issue_number: pr.number, name });
            }
            await github.rest.issues.addLabels({
              owner, repo, issue_number: pr.number,
              labels: protegidos.length ? [etiqueta, REVISAR] : [etiqueta],
            });

            // 7. Comentario con el detalle (se edita el mismo en cada push)
            const avisoProtegidos = protegidos.length
              ? `\n> [!WARNING]\n> Modificaste archivos que no se deben tocar: ${protegidos.map((f) => "`" + f + "`").join(", ")}.\n> La profe revisará este PR manualmente.\n`
              : "";
            const avisoSinResultado = sinResultado
              ? "\n> [!CAUTION]\n> No se pudo calificar este push. Abre el enlace de abajo para ver qué pasó.\n"
              : "";
            const cuerpo = [
              MARCADOR,
              `## 🎯 Nota: ${nota.toFixed(1)} / 5.0`,
              `Tests aprobados: **${pasados}/${total}**`,
              avisoProtegidos + avisoSinResultado,
              "| Estado | Ejercicio | Tests |",
              "|---|---|---|",
              ...filas,
              "",
              `🔎 [Ver qué falta por corregir](${enlaceRun})`,
              "",
              "_Cada vez que hagas `git push` a tu rama, esta nota se actualiza sola._",
            ].join("\n");

            const comentarios = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number: pr.number, per_page: 100,
            });
            const previo = comentarios.find((c) => c.user.type === "Bot" && c.body.includes(MARCADOR));
            if (previo) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: previo.id, body: cuerpo });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number: pr.number, body: cuerpo });
            }
            core.info(`PR #${pr.number}: ${etiqueta}`);
